const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let netFail=0;
async function nm(q,n){const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit='+(n||3)+'&countrycodes=mx&q='+encodeURIComponent(q),{signal:c.signal})).json();netFail=0;return r}catch(e){netFail++;return[]}finally{clearTimeout(to)}}
