{const o=LS('geo')||{};Object.keys(o).forEach(k=>{if(o[k].src==='manual'&&!geo[k])geo[k]=o[k]})}

  recs.push({ruta,marca,cr,tienda:S(r,k=>k==='tienda'),mpo,tipo:S(r,k=>k==='tipo')||'Lona',medida:med,orig:S(r,k=>k.startsWith('medidaoriginal'))||med,promo:S(r,k=>k.startsWith('promo')),desde:ds(get(r,k=>k.startsWith('vigenciadesde'))),hasta:ds(get(r,k=>k.startsWith('vigenciahasta')))});
  if(!addr[cr]||(dir&&!addr[cr].dir))addr[cr]={dir,mpo};
  const c=coord(get(r,k=>k.startsWith('coord')));if(c==='bad')bad++;else if(c)ng[cr]={lat:c.lat,lng:c.lng,src:'manual'};
  const o=parseFloat(get(r,k=>k==='orden'));if(!isNaN(o)){const key=ruta+'|'+cr;ord[key]=Math.min(ord[key]??1e9,o)}});
 if(!recs.length)return $('st').textContent='No encontré filas válidas. Revisa que existan las columnas Ruta, CR, Tienda, Marca, Tipo y Medida.';
 const k0=r=>r.cr+'|'+r.marca+'|'+r.tipo,old={};D.recs.forEach(r=>{if(done[r.id])old[k0(r)]=1});
 recs.forEach((r,i)=>r.id=i);const nd={};recs.forEach(r=>{if(old[k0(r)])nd[r.id]=true});
 const og=geo;geo={};Object.keys(og).forEach(k=>{if(og[k].src==='manual'&&addr[k])geo[k]=og[k]});Object.assign(geo,ng);
 P={};rutas.forEach(ru=>{const l=Object.keys(ord).filter(k=>k.startsWith(ru+'|')).sort((a,b)=>ord[a]-ord[b]).map(k=>k.slice(ru.length+1));if(l.length)P[ru]=l});
 D={rutas,recs,addr};done=nd;AD={};RL={};route=rutas[0];fitNext=true;
 SV('data',D);SV('done',done);SV('geo2',geo);SV('plan',P);SV('ad',AD);fillBrands();
 const st=new Set(recs.map(r=>r.cr)),sc=[...st].filter(c=>!geo[c]).length;
 $('st').textContent='Cargado: '+st.size+' tiendas, '+recs.length+' espacios, '+rutas.length+' rutas. '+(sc?sc+' sin coordenadas (se navegan con Google Maps). ':'Todas con coordenadas. ')+(bad?bad+' coordenadas inválidas ignoradas.':'');render()
 }catch(e){$('st').textContent='No se pudo leer el Excel: '+e.message}}

 rows.push({'Ruta':ru,'CR':r.cr,'Tienda':r.tienda,'Municipio':r.mpo||a.mpo||'','Dirección':AD[r.cr]!==undefined?AD[r.cr]:(a.dir||''),'Coordenadas (pegar de Google Maps)':g&&g.src==='manual'?g.lat.toFixed(6)+', '+g.lng.toFixed(6):'','Orden':o<0?'':o+1,'Marca':r.marca,'Tipo':r.tipo,'Medida (m)':r.medida,'Medida original':r.orig,'Promoción':r.promo,'Vigencia desde':r.desde||(VG[r.marca]||[])[0]||'','Vigencia hasta':r.hasta||(VG[r.marca]||[])[1]||''})}));

 if(rline){rline.remove();rline=null}
