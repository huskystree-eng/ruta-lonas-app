const phRow=x=>{const k=phk(x);return'<div class="ph">'+[['a','Antes'],['d','Después']].map(([s,n])=>PH[k+'|'+s]?'<img class="th" data-v="'+esc(k+'|'+s)+'" src="'+PH[k+'|'+s].url+'" alt="'+n+'"><small>'+n+'</small>':'<button data-p="'+esc(k+'|'+s)+'">📷 '+n+'</button>').join(' ')+'</div>'};
const fdt=ts=>new Date(ts).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
async function addPhoto(key,file){const[cr,marca,tipo,medida,slot]=key.split('|'),rec=D.recs.find(r=>phk(r)+'|'+slot===key);if(!rec)return;
 try{$('st').textContent='Procesando foto…';
 const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)}),sc=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc),c=document.createElement('canvas');
 c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);
 let pos=me;if(!pos&&navigator.geolocation)pos=await new Promise(r=>navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{timeout:4000,maximumAge:60000}));
 const ts=new Date().toISOString(),bh=Math.max(16,Math.round(w/40));
 g.fillStyle='rgba(0,0,0,.65)';g.fillRect(0,h-bh*1.7,w,bh*1.7);g.fillStyle='#fff';g.font=bh+'px sans-serif';g.textBaseline='middle';
 g.fillText((slot==='a'?'ANTES':'DESPUÉS')+' · '+rec.tienda+' ('+cr+') · '+fdt(ts)+(pos?' · '+pos.lat.toFixed(5)+', '+pos.lng.toFixed(5):''),8,h-bh*.85,w-16);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.7)),v={blob,ts,w,h,lat:pos?pos.lat:null,lng:pos?pos.lng:null};
 if(PH[key])URL.revokeObjectURL(PH[key].url);PH[key]={...v,url:URL.createObjectURL(blob)};
 try{await dbSet(key,v)}catch(e){idbOk=false}
 if(slot==='d'){done[rec.id]=true;SV('done',done)}
 $('st').textContent='Foto guardada'+(slot==='d'?' y espacio marcado como hecho':'')+(idbOk?'':' (aviso: este navegador no permite guardarla; descarga el informe antes de cerrar)')+'.';render()
 }catch(e){$('st').textContent='No se pudo procesar la foto: '+(e&&e.message||e)}}
$('cam').onchange=e=>{const f=e.target.files[0],k=$('cam').dataset.k;e.target.value='';if(f&&k)addPhoto(k,f)};

const b64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(b)});
async function buildReport(rows,rutas){
 const wb=new ExcelJS.Workbook(),rs_=wb.addWorksheet('Resumen'),ws=wb.addWorksheet('Seguimiento',{views:[{state:'frozen',ySplit:1}]}),RED='FFC8102E',nf=ts=>ts?new Date(ts).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):'';
 rs_.columns=[{width:30},{width:14},{width:14},{width:14},{width:14}];
 rs_.addRow(['Informe de seguimiento · Lonas y pendones P12']).font={bold:true,size:14};rs_.addRow(['Generado',nf(new Date().toISOString())]);rs_.addRow([]);
 const h=rs_.addRow(['Ruta','Espacios','Completados','Con foto antes','Con foto después']);h.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:RED}}});
 const tot=[0,0,0,0];rutas.forEach(ru=>{const l=rows.filter(r=>r.ruta===ru),v=[l.length,l.filter(r=>r.done).length,l.filter(r=>r.a).length,l.filter(r=>r.d).length];v.forEach((x,i)=>tot[i]+=x);rs_.addRow([ru,...v])});
 rs_.addRow(['TOTAL',...tot]).font={bold:true};rs_.addRow([]);rs_.addRow(['Nota: este resumen cuenta solo los espacios incluidos en el informe (con foto o marcados como hechos).']).font={italic:true,color:{argb:'FF7F7F7F'}};
 ws.columns=[['Ruta',20],['CR',9],['Tienda',24],['Municipio',16],['Dirección',36],['Marca',11],['Tipo',9],['Medida (m)',12],['Promoción',40],['Estado',13],['Fecha y hora',17],['GPS (lat, lng)',22],['Notas',28],['Foto ANTES',34],['Foto DESPUÉS',34]].map(([header,width])=>({header,width}));
 ws.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:RED}};c.alignment={vertical:'middle',horizontal:'center',wrapText:true}});ws.getRow(1).height=24;
 for(const r of rows){const p=r.d||r.a,row=ws.addRow([r.ruta,r.cr,r.tienda,r.mpo,r.dir,r.marca,r.tipo,r.medida,r.promo,r.done?'COMPLETADO':'EN PROCESO',nf(p&&p.ts),p&&p.lat!=null?p.lat.toFixed(6)+', '+p.lng.toFixed(6):'',r.nota,'','']);
  row.alignment={vertical:'top',wrapText:true};row.getCell(10).font={bold:true,color:{argb:r.done?'FF2E7D32':'FFB26A00'}};let hpt=30;
  for(const[i,p2]of[[13,r.a],[14,r.d]]){if(!p2)continue;const id=wb.addImage({base64:p2.b64||await b64(p2.blob),extension:'jpeg'}),W=240,H=Math.round(W*p2.h/p2.w);ws.addImage(id,{tl:{col:i+.05,row:row.number-1+.03},ext:{width:W,height:H}});hpt=Math.max(hpt,H*.75+8)}
  row.height=Math.min(hpt,400)}
 return wb.xlsx.writeBuffer()}
$('rp').onclick=async()=>{const rows=[];
 D.recs.forEach(x=>{const k=phk(x),a=PH[k+'|a'],d=PH[k+'|d'];if(!done[x.id]&&!a&&!d)return;const ad=D.addr[x.cr]||{};rows.push({ruta:x.ruta,cr:x.cr,tienda:x.tienda,mpo:x.mpo||ad.mpo||'',dir:AD[x.cr]!==undefined?AD[x.cr]:(ad.dir||''),marca:x.marca,tipo:x.tipo,medida:x.medida,promo:x.promo,done:!!done[x.id],a,d,nota:notes[x.cr]||''})});

 const buf=await buildReport(rows,D.rutas),name='Seguimiento_Lonas_P12_'+new Date().toISOString().slice(0,10)+'.xlsx',f=new File([buf],name,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

 if(rline){rline.remove();rline=null}
